<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRGVC · Offline</title><style>body{font:16px/1.6 system-ui;background:#060817;color:#f5f2ff;max-width:640px;margin:40px auto;padding:20px}img{width:110px;border-radius:16px}article{background:#151123;padding:20px;margin:16px 0;border:1px solid #493154;border-radius:16px}p{white-space:pre-wrap;overflow-wrap:anywhere}a{color:#d0aaff}small{color:#b4a7c7}</style></head><body><img src="/community/trgvc.webp" alt="TRGVC"><h1>You’re offline.</h1><p>You can read previously loaded creator posts below. Reconnect to sign in, refresh or make changes.</p><a href="/community/">Try connecting again →</a><main id="posts"></main><script>try{const posts=JSON.parse(localStorage.getItem('trgvc-offline-posts')||'[]');for(const p of posts){const a=document.createElement('article'),h=document.createElement('h2'),b=document.createElement('p'),d=document.createElement('small');h.textContent=p.title||'TRGVC update';b.textContent=p.body;d.textContent='Saved on this device · '+new Date(p.date).toLocaleDateString();a.append(h,b,d);document.getElementById('posts').append(a)}if(!posts.length)document.getElementById('posts').textContent='No posts have been cached on this device yet.'}catch{document.getElementById('posts').textContent='No cached posts are available.'}</script></body></html>
