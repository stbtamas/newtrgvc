<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0414"/>
      <stop offset="50%" stop-color="#050508"/>
      <stop offset="100%" stop-color="#02101f"/>
    </linearGradient>
    <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e81cff"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="45%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="128" height="128" rx="26" fill="url(#bg)" stroke="url(#rim)" stroke-width="3"/>
  <!-- Outer Neon V-Shield Rim -->
  <polygon points="16,22 64,46 112,22 64,112" fill="none" stroke="url(#rim)" stroke-width="6" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Metallic Cracked V-Shield Body -->
  <polygon points="20,26 64,48 108,26 64,106" fill="url(#chrome)"/>
  <!-- Inner Cutouts Matching TRGVC V/T Emblem -->
  <polygon points="36,42 56,52 56,78" fill="#07070c"/>
  <polygon points="92,42 72,52 72,78" fill="#07070c"/>
  <polygon points="53,84 75,84 64,102" fill="url(#chrome)"/>
</svg>
